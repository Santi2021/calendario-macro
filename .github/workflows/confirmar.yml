name: Confirmar publicaciones

on:
  schedule:
    # GitHub no garantiza la hora de las corridas programadas: con carga las atrasa (hubo atrasos de
    # más de 3 horas) o las saltea. La defensa es la frecuencia: una corrida cada 30 minutos en horario
    # hábil, así si una se atrasa o se pierde, la siguiente la cubre. El confirmador y los avisos son
    # idempotentes (correrlos de más no cambia nada ni duplica avisos). Minutos impares para esquivar
    # la congestión de la hora en punto. Horarios en UTC (Argentina = UTC-3).
    - cron: "7,37 12-23 * * 1-5"   # lunes a viernes, 09:07 a 20:37 cada media hora
    - cron: "7 0 * * 2-6"          # 21:07, cierre del día hábil
    - cron: "17 13,21 * * 0,6"     # fines de semana: 10:17 y 18:17
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin escribir (dejalo destildado para una corrida real)"
        type: boolean
        default: false
      aviso_prueba:
        description: "Mandar un aviso de prueba al celular"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: confirmador
  cancel-in-progress: false   # nunca dos corridas a la vez escribiendo el estado

jobs:
  confirmar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests==2.32.3 pywebpush==2.5.0

      - name: Autotest (si falla, no se toca ningún dato)
        run: python confirmador.py --selftest

      - name: Corrida
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python confirmador.py --dry-run
          else
            python confirmador.py
          fi

      - name: Avisos al celular (resumen de la mañana y alertas de la noche)
        env:
          PUSH_SUSCRIPCION: ${{ secrets.PUSH_SUSCRIPCION }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
        run: |
          python aviso.py --selftest
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.aviso_prueba }}" = "true" ]; then
            python aviso.py --prueba
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python aviso.py --dry-run
          else
            python aviso.py || echo "Falló el envío del aviso (no frena la corrida)"
          fi

      - name: Calendario suscribible (.ics)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python ics.py || echo "No se pudo generar el .ics (no frena la corrida)"

      # Las extracciones de datos no necesitan correr cada media hora: una marca con la hora de la
      # última ejecución (data/.marcas) las limita a cada 3 horas y a una vez por día, respectivamente.
      - name: ¿Toca extraer datos?
        id: marcas
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          mkdir -p data/.marcas
          ahora=$(date -u +%s); hoy=$(date -u +%F)
          ult=$(cat data/.marcas/extracciones 2>/dev/null || echo 0)
          if [ $((ahora - ult)) -ge 10800 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "extraer=1" >> "$GITHUB_OUTPUT"; echo "$ahora" > data/.marcas/extracciones; fi
          if [ "$(cat data/.marcas/bcra_api 2>/dev/null)" != "$hoy" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "api=1" >> "$GITHUB_OUTPUT"; echo "$hoy" > data/.marcas/bcra_api; fi

      - name: Datos del mercado de cambios (BCRA)
        if: ${{ steps.marcas.outputs.extraer == '1' }}
        run: python extraer_cambiario.py

      - name: Anexo sectorial CLANAE (BCRA)
        if: ${{ steps.marcas.outputs.extraer == '1' }}
        run: python extraer_clanae.py

      - name: Series monetarias en dólares (API BCRA, una vez por día)
        if: ${{ steps.marcas.outputs.api == '1' }}
        run: python extraer_bcra_api.py

      - name: Guardar estado
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "confirmador"
          git config user.email "confirmador@users.noreply.github.com"
          git add data/estado.json data/reporte.md data/avisos.json data/macrocalendar.ics
          git add data/cambiario 2>/dev/null || true
          git add data/bcra_api 2>/dev/null || true
          git add data/.marcas 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Confirmaciones $(date -u +%F)"
            git pull --rebase
            git push
            # Los push del bot no siempre disparan la reconstrucción de la web: se pide explícitamente
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la reconstrucción de la web"
          fi
