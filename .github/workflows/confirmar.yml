name: Confirmar publicaciones

on:
  schedule:
    # Varias corridas por día: GitHub puede demorar o saltear un horario programado,
    # y el confirmador es idempotente (correrlo de más no cambia nada).
    # Horarios en UTC; entre paréntesis, hora argentina.
    - cron: "17 12 * * *"   # (09:17) lo del día anterior
    - cron: "47 13 * * *"   # (10:47) respaldo de la mañana
    - cron: "17 17 * * *"   # (14:17) mediodía
    - cron: "47 19 * * *"   # (16:47) después de INDEC (16:00)
    - cron: "17 22 * * *"   # (19:17) cierre del BCRA
    - cron: "47 23 * * *"   # (20:47) respaldo de la noche
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin escribir"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: confirmador
  cancel-in-progress: false   # nunca dos corridas a la vez escribiendo el estado

jobs:
  confirmar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install requests==2.32.3

      - name: Autotest (si falla, no se toca ningún dato)
        run: python confirmador.py --selftest

      - name: Corrida
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python confirmador.py --dry-run
          else
            python confirmador.py
          fi

      - name: Datos del mercado de cambios (BCRA)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python extraer_cambiario.py

      - name: Anexo sectorial CLANAE (BCRA)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python extraer_clanae.py

      - name: Guardar estado
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "confirmador"
          git config user.email "confirmador@users.noreply.github.com"
          git add data/estado.json data/reporte.md
          git add data/cambiario 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Confirmaciones $(date -u +%F)"
            git pull --rebase
            git push
            # Los push del bot no siempre disparan la reconstrucción de la web: se pide explícitamente
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la reconstrucción de la web"
          fi
