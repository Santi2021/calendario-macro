name: Sonda
on:
  push:
    branches: [sonda]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import re, json, urllib.request, sys
          sys.stdout=open('salida.txt','w')
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(r,timeout=60) as x: return x.read().decode("utf-8","replace")
          def head(u):
              try:
                  r=urllib.request.Request(u,method="HEAD",headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(r,timeout=60) as x: return x.status, x.headers.get("Last-Modified"), x.headers.get("Content-Length")
              except Exception as e: return str(e)
          import requests
          for u in ['https://www.indec.gob.ar/ftp/cuadros/economia/sh_ipc_09_26.xls', 'https://www.indec.gob.ar/ftp/cuadros/economia/sh_ipc_10_26.xls', 'https://www.indec.gob.ar/ftp/cuadros/economia/epi_09_26.pdf', 'https://www.indec.gob.ar/ftp/cuadros/economia/epi_12_26.pdf', 'https://www.argentina.gob.ar/sites/default/files/trabajoregistrado_2606_estadisticas.xlsx', 'https://www.argentina.gob.ar/sites/default/files/trabajoregistrado_2612_estadisticas.xlsx', 'https://www.arca.gob.ar/institucional/documentos/ARCA-Recaudacion-082026.pdf', 'https://www.arca.gob.ar/institucional/documentos/ARCA-Recaudacion-122026.pdf', 'https://www.argentina.gob.ar/sites/default/files/ripte_julio_2026-mdch.pdf', 'https://www.usda.gov/oce/commodity/wasde/wasde0926.pdf', 'https://www.usda.gov/oce/commodity/wasde/wasde1226.pdf']:
              try:
                  r=requests.head(u,headers={"User-Agent":"Mozilla/5.0"},timeout=30,allow_redirects=True)
                  print("CT",r.status_code,r.headers.get("Content-Type"),r.headers.get("Last-Modified"),r.headers.get("Content-Length"),r.url!=u,u)
              except Exception as e: print("CT",u,e)
      - run: |
          git config user.name bot; git config user.email bot@x
          git add salida.txt; git commit -qm salida; git push -q
