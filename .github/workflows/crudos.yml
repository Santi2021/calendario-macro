name: Bajar crudos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: write

jobs:
  crudos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bajar_crudos.py
      - name: Guardar
        run: |
          git config user.name "crudos-bot"
          git config user.email "actions@github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Crudos actualizados"
          git pull --rebase || true
          git push
