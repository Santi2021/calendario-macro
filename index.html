<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacroCalendAR</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15212B">
<link rel="icon" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECEF;--panel:#F6F8F9;--panel2:#FFFFFF;--ink:#15212B;--ink2:#4A5864;--ink3:#83909B;--line:#CDD5DB;
--indec:#1D5FAF;--bcra:#0D7A68;--estado:#A8452C;--privados:#7454A3;--sectorial:#8A6D1F;--ok:#1E7B4A;--warn:#B7791F;--bad:#C0392B;
--hoy:#15212B;--hoyTxt:#F6F8F9;--ar:#3F86C9;--f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171C;--panel:#19222A;--panel2:#1F2A33;--ink:#E4E9ED;--ink2:#A7B3BC;--ink3:#6F7C86;--line:#2B363F;
--indec:#6FA3E6;--bcra:#4CC2AC;--estado:#E0826A;--privados:#B39AE0;--sectorial:#D6B460;--ok:#5CCB8D;--warn:#E8B04E;--bad:#F07A6B;--hoy:#E4E9ED;--hoyTxt:#11171C;--ar:#74ACDF}}
:root[data-theme="dark"]{--bg:#11171C;--panel:#19222A;--panel2:#1F2A33;--ink:#E4E9ED;--ink2:#A7B3BC;--ink3:#6F7C86;--line:#2B363F;
--indec:#6FA3E6;--bcra:#4CC2AC;--estado:#E0826A;--privados:#B39AE0;--sectorial:#D6B460;--ok:#5CCB8D;--warn:#E8B04E;--bad:#F07A6B;--hoy:#E4E9ED;--hoyTxt:#11171C;--ar:#74ACDF}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--indec);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 80px}
/* barra superior fija */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1*clamp(12px,3vw,32px)) 18px;padding:10px clamp(12px,3vw,32px)}
.topbar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{font-weight:700;font-size:15px;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.marca .mk{width:24px;height:24px;border-radius:6px;align-self:center}.marca i{font-style:normal;color:var(--ar)}
.marca small{font-weight:500;color:var(--ink3);font-size:13px}
.reloj{font-weight:600;color:var(--ink2);font-size:14px}
.views{display:flex;gap:2px;background:var(--line);padding:2px;border-radius:8px}
.views button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px}
.views button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:650}
.buscar{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;width:220px}
.icono{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
/* hoy */
.hoy{background:var(--hoy);color:var(--hoyTxt);border-radius:16px;padding:22px clamp(16px,3vw,32px);display:grid;grid-template-columns:auto 1fr auto;gap:clamp(16px,4vw,44px);align-items:start;margin-bottom:18px}
.hoy .fecha{font-stretch:62%;font-weight:750;line-height:.82;font-size:clamp(64px,10vw,124px);letter-spacing:-.02em}
.hoy .fecha small{display:block;letter-spacing:0;font-size:15px;font-stretch:100%;font-weight:500;margin-top:10px;opacity:.7;line-height:1.3}
.hoy h2{margin:4px 0 12px;font-size:16px;font-weight:600;opacity:.7}
.hoy ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}.hoy ul.sinh li{grid-template-columns:1fr}.hoy ul.sinh .h{display:none}
.hoy li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;cursor:pointer}
.hoy li .h{font-weight:600;opacity:.7}.hoy li .t{font-size:clamp(17px,2vw,21px);font-weight:600;line-height:1.25}
.hoy li .t.baja{font-weight:400;opacity:.8;font-size:16px}.hoy li .o{font-size:13px;opacity:.6;font-weight:500;margin-left:6px}
.hoy .vacio{font-size:19px;font-weight:500;opacity:.85;margin:0}
.prox{min-width:210px;border-left:1px solid color-mix(in srgb,var(--hoyTxt) 25%,transparent);padding-left:clamp(14px,2vw,28px)}
.prox .l{font-size:13px;opacity:.65}.prox .cd{font-stretch:75%;font-weight:700;font-size:36px;line-height:1.05;margin:4px 0}
.prox .n{font-size:15px;font-weight:600;line-height:1.3}.prox .w{font-size:13px;opacity:.65;margin-top:2px}
/* resumen de estado */
.salud{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--ink2);margin:-4px 2px 16px}
.salud b{color:var(--ink)}
/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:14px}
.grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grupo>span{font-size:13px;color:var(--ink3);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px 4px 9px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink3))}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink3)}
.alerta{border-left:3px solid var(--bad);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:14px}
.alerta b{color:var(--bad)}.alerta.info{border-color:var(--warn)}.alerta.info b{color:var(--warn)}
.nav{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;cursor:pointer}
.nav .rango{font-weight:650;font-size:17px;margin-left:6px}
/* estado de cada evento */
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 7px;line-height:1.5}
.st.confirmado{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.demorado{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.st.sin_verificar{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
/* agenda */
.agenda{display:grid;gap:14px}
.agdia{display:grid;grid-template-columns:120px 1fr;gap:18px;background:var(--panel);border-radius:12px;padding:14px 16px;border:1px solid transparent}
.agdia.es-hoy{border-color:var(--ink)}.agdia.pasado{opacity:.72}
.agdia .d .n{font-stretch:62%;font-weight:750;font-size:40px;line-height:.9}.agdia .d .w{font-size:13px;color:var(--ink2);margin-top:4px}
.agdia .d .fer{font-size:12px;color:var(--bad);display:block}
.ev{display:grid;grid-template-columns:4px 54px 1fr auto;gap:10px;padding:7px 6px 7px 0;cursor:pointer;border-radius:6px;align-items:start}
.ev:hover{background:var(--bg)}.ev .bar{border-radius:2px;background:var(--c);align-self:stretch}
.ev.est .bar{background:repeating-linear-gradient(var(--c) 0 4px,transparent 4px 7px)}
.ev .h{font-size:13px;color:var(--ink3);padding-top:1px}.ev .t{font-size:14.5px;line-height:1.3}
.ev.alta .t{font-weight:680;font-size:15.5px}.ev.baja .t{color:var(--ink2);font-size:13.5px}
.ev .m{font-size:12px;color:var(--ink3);margin-top:1px}
/* semana */
.semana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dia{background:var(--panel);border-radius:10px;padding:12px 10px 14px;min-height:220px;border:1px solid transparent}
.dia.es-hoy{border-color:var(--ink)}.dia.feriado,.celda.feriado{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--bg) 8px 9px)}
.dia header{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dia header .n{font-stretch:62%;font-weight:750;font-size:36px;line-height:.9}.dia header .d{font-size:13px;color:var(--ink2);line-height:1.2}
.dia header .fer{font-size:12px;color:var(--bad);display:block}
.dia .ev{grid-template-columns:4px 1fr}.dia .ev .h{display:none}.dia .ev .s{grid-column:2}
/* mes */
.mes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.mes .cab{font-size:13px;color:var(--ink3);padding:0 4px}
.celda{background:var(--panel);border-radius:8px;padding:8px;min-height:104px;cursor:pointer;border:1px solid transparent;text-align:left;display:flex;flex-direction:column;gap:4px}
.celda.fuera{opacity:.35}.celda.es-hoy{border-color:var(--ink)}
.celda .n{font-stretch:62%;font-weight:750;font-size:24px;line-height:1}.celda .dens{display:flex;gap:2px;flex-wrap:wrap}
.celda .dens i{width:7px;height:7px;border-radius:2px;background:var(--c)}.celda .dens i.a{height:14px}
.celda .top{font-size:12px;line-height:1.25;color:var(--ink2)}.celda .top b{color:var(--ink);font-weight:650}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:22px;align-items:center}
.leyenda span{display:inline-flex;align-items:center;gap:6px}.leyenda .s{width:4px;height:14px;background:var(--ink3);border-radius:2px}
.leyenda .s.e{background:repeating-linear-gradient(var(--ink3) 0 4px,transparent 4px 7px)}
.ev .m a.inf{color:var(--ar);text-decoration:none;font-weight:600}
.link{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
/* panel lateral de detalle */
.cortina{position:fixed;inset:0;background:rgba(10,15,20,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.cortina.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel2);z-index:41;transform:translateX(100%);transition:transform .2s ease;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);border-left:6px solid var(--c,var(--ink3))}
.panel.on{transform:none}
.panel .org{font-size:13px;color:var(--ink2);font-weight:600}.panel h3{margin:4px 0 12px;font-size:21px;line-height:1.25}
.panel dl{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;margin:0 0 18px;font-size:14px}.panel dt{color:var(--ink3)}.panel dd{margin:0}
.panel h4{font-size:14px;margin:18px 0 8px;color:var(--ink2);font-weight:600}
.hist{width:100%;border-collapse:collapse;font-size:13.5px}.hist td{padding:5px 6px;border-bottom:1px solid var(--line)}
.panel a{color:var(--indec)}.cerrar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;cursor:pointer}
.atajos{font-size:12.5px;color:var(--ink3)}kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
/* avisos */
.icono.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pasos{margin:0 0 16px;padding-left:20px;font-size:14px;display:grid;gap:8px}.pasos b{font-weight:650}
.codigo{width:100%;min-height:118px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px;resize:vertical;word-break:break-all}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:650;cursor:pointer;background:var(--ink);color:var(--panel2)}.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}.nota{font-size:13px;color:var(--ink3);margin:10px 0 0}
@media (max-width:900px){.topbar{position:static;margin-bottom:12px}.reloj{display:none}.semana{grid-template-columns:1fr}.dia{min-height:0}.mes{gap:3px}.celda{min-height:62px;padding:5px}.celda .top{display:none}
.hoy{grid-template-columns:1fr}.prox{border-left:0;padding-left:0;border-top:1px solid color-mix(in srgb,var(--hoyTxt) 25%,transparent);padding-top:14px}
.agdia{grid-template-columns:1fr;gap:6px}.agdia .d{display:flex;align-items:baseline;gap:10px}.buscar{width:100%}.ev{grid-template-columns:4px 44px 1fr}.ev .s{grid-column:3}}

/* ================= sistema de diseño compartido (tokens) ================= */
:root{
 /* espacio: grilla de 4 */
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
 /* radio */
 --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:28px;
 /* tipo (escala HIG adaptada) */
 --t-large:32px;--t-title:22px;--t-head:17px;--t-body:16px;--t-sub:15px;--t-foot:13px;--t-cap:12px;
 /* movimiento: resortes */
 --spring:linear(0,.043,.147,.278,.415,.545,.661,.758,.837,.897,.942,.974,.996,1.009,1.016,1.019,1.02,1.018,1.016,1.013,1.011,1.008,1.006,1.004,1);
 --snap:linear(0,.077,.238,.413,.571,.7,.798,.87,.919,.952,.973,.986,.994,.998,1);
 --press:scale(.97);
 /* superficies claro */
 --bg:#EEF1F4;--card:#FFFFFF;--card2:#F4F6F8;--fill:rgba(21,33,43,.06);--sep:rgba(21,33,43,.10);
 --ink3:#5E6A75;--link:#2A6DB0;--acc:#2A6DB0;--warn:#875A0C;--ok:#17683E;--bad:#AE3024;--ar-fill:rgba(63,134,201,.14);
 --hero:#15212B;--heroTxt:#F4F7F9;--heroSub:rgba(244,247,249,.62);
 --glass:rgba(238,241,244,.78);--glass-tab:rgba(255,255,255,.80);--segon:#FFFFFF;--card-sh:0 1px 2px rgba(16,24,32,.05),0 0 0 .5px rgba(16,24,32,.04);--glow:0;
 --shadow-sheet:0 -8px 40px rgba(10,20,30,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1318;--card:#172028;--card2:#1D2831;--fill:rgba(228,233,237,.07);--sep:rgba(228,233,237,.09);
 --ink3:#8793A0;--link:#86B8E6;--acc:#2E73B4;--warn:#E8B04E;--ar-fill:rgba(116,172,223,.18);
 --hero:linear-gradient(145deg,#1F3A52 0%,#182A3A 55%,#162330 100%);--heroTxt:#EEF3F7;--heroSub:rgba(238,243,247,.6);
 --glass:rgba(14,19,24,.74);--glass-tab:rgba(23,32,40,.78);--segon:#33414D;--card-sh:none;--glow:1;
 --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
 --bg:#0E1318;--card:#172028;--card2:#1D2831;--fill:rgba(228,233,237,.07);--sep:rgba(228,233,237,.09);
 --ink3:#8793A0;--link:#86B8E6;--acc:#2E73B4;--warn:#E8B04E;--ar-fill:rgba(116,172,223,.18);
 --hero:linear-gradient(145deg,#1F3A52 0%,#182A3A 55%,#162330 100%);--heroTxt:#EEF3F7;--heroSub:rgba(238,243,247,.6);
 --glass:rgba(14,19,24,.74);--glass-tab:rgba(23,32,40,.78);--segon:#33414D;--card-sh:none;--glow:1;
 --shadow-sheet:0 -8px 40px rgba(0,0,0,.5)}
/* ---- componentes compartidos (celu y compu): detalle, estados, vacíos ---- */
.msal{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;font-size:var(--t-cap);color:var(--ink3);margin:var(--s2) var(--s4) 0}.msal b{color:var(--ink2)}
.panel .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--ink2);display:grid;place-items:center;padding:0}
.panel .x svg{width:15px;height:15px}
.panel .ht{margin:0 44px var(--s4) 0;font-size:var(--t-title);font-weight:750;letter-spacing:-.4px}
.panel .cerrar{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--ink2);font-size:0;padding:0;display:grid;place-items:center}
.panel .cerrar::before{content:"\2715";font-size:14px;font-weight:700}
.panel>.org{font-size:var(--t-cap);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.panel>h3{font-size:var(--t-title);font-weight:750;letter-spacing:-.4px;margin:4px 44px var(--s3) 0}
.panel p{line-height:1.5;color:var(--ink2)}
.panel .btn{min-height:44px;border-radius:999px;padding:0 20px;background:var(--acc);color:#fff}.panel .btn.sec{background:var(--fill);color:var(--ink);border:0}
.panel .codigo{border:0;background:var(--fill);border-radius:var(--r-sm)}
.mdo{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-cap);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.mdo i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.panel .mdt{margin:0 44px 4px 0;font-size:28px;line-height:1.1;font-weight:750;letter-spacing:-.5px;text-wrap:balance}
.mdsub{margin:0 0 var(--s4);font-size:var(--t-foot);line-height:1.4;color:var(--ink3);text-wrap:pretty}
.mdk{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--card2);border-radius:var(--r-md);padding:var(--s4);margin:var(--s3) 0}
.mdd{font-size:var(--t-head);font-weight:650;letter-spacing:-.2px}.mdd::first-letter{text-transform:uppercase}.mdr{font-size:var(--t-foot);color:var(--ink2);margin-top:2px}
.mdal{border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s3);font-size:var(--t-foot);background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--ink)}.mdal b{color:var(--bad)}
.mda{display:flex;gap:var(--s2);margin:0 0 var(--s5)}
.bt{flex:1 1 0;min-width:0;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--fill);color:var(--ink);border-radius:var(--r-md);padding:0 6px;font:inherit;font-size:var(--t-foot);font-weight:650;text-decoration:none;white-space:nowrap}
.bt svg{width:18px;height:18px;flex:none}
.bt.pri{flex:1.25 1 0;background:var(--acc);color:#fff}
.mdl{background:var(--card2);border-radius:var(--r-md);padding:0 var(--s4)}
.mdl .li{position:relative;display:flex;justify-content:space-between;gap:var(--s4);min-height:48px;align-items:center;padding:var(--s2) 0;font-size:var(--t-sub)}
.mdl .li+.li::before{content:"";position:absolute;top:0;left:0;right:calc(-1*var(--s4));height:.5px;background:var(--sep)}
.mdl .li span{color:var(--ink3);flex:none}.mdl .li b{font-weight:550;text-align:right}
.mdl .li b::first-letter{text-transform:uppercase}
.mdreg{margin:var(--s3) 0 0;font-size:var(--t-sub)}
.mdreg summary{color:var(--link);font-weight:600;cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center}
.mdreg summary::-webkit-details-marker{display:none}.mdreg summary::after{content:"›";margin-left:6px;display:inline-block;transition:transform .3s var(--spring)}.mdreg[open] summary::after{transform:rotate(90deg)}
.mdreg p{margin:0 0 var(--s2);color:var(--ink2);line-height:1.5}
.mdh4{margin:var(--s5) var(--s4) var(--s2);font-size:var(--t-foot);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.mdhist{background:var(--card2);border-radius:var(--r-md);padding:0 var(--s4)}
.mdhist .hi{position:relative;display:grid;grid-template-columns:88px 1fr auto;gap:var(--s3);align-items:center;min-height:48px;font-size:var(--t-sub)}

/* ================= versión celular · sistema de diseño =================

   Todo sale de tokens: color, tipo, espacio, radio y movimiento. */
#m{display:none}
@media (max-width:760px){

 .mh .mtt{position:absolute;left:0;right:0;text-align:center;font-weight:650;font-size:var(--t-head);letter-spacing:-.2px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .3s var(--snap);pointer-events:none}

 /* ---- páginas deslizables ---- */

 .pg{position:relative;flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;overscroll-behavior-y:contain;contain:paint}

 /* ---- barra de pestañas: indicador que se desliza (M3) ---- */
 .tabs{position:relative;flex:none;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass-tab);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
 .tabs button{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;font-size:11.5px;font-weight:500;letter-spacing:.1px;color:var(--ink3);padding:0;transition:color .2s}

 /* ---- tarjetas: lista agrupada con separadores al ras del texto (HIG) ---- */

 @supports (corner-shape:squircle){.card,.mg button,.bt,.mdk,.panel .buscar{corner-shape:squircle}.card{border-radius:30px}.mg button{border-radius:22px}.bt,.mdk{border-radius:24px}}

 /* ---- fila de publicación: barra de color como Calendario de Apple ---- */

 .pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}

 /* ======== pasada de detalle ======== */
