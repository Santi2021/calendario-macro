<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario macro Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECEF;--panel:#F6F8F9;--panel2:#FFFFFF;--ink:#15212B;--ink2:#4A5864;--ink3:#83909B;--line:#CDD5DB;
--indec:#1D5FAF;--bcra:#0D7A68;--estado:#A8452C;--privados:#7454A3;--sectorial:#8A6D1F;--ok:#1E7B4A;--warn:#B7791F;--bad:#C0392B;
--hoy:#15212B;--hoyTxt:#F6F8F9;--f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171C;--panel:#19222A;--panel2:#1F2A33;--ink:#E4E9ED;--ink2:#A7B3BC;--ink3:#6F7C86;--line:#2B363F;
--indec:#6FA3E6;--bcra:#4CC2AC;--estado:#E0826A;--privados:#B39AE0;--sectorial:#D6B460;--ok:#5CCB8D;--warn:#E8B04E;--bad:#F07A6B;--hoy:#E4E9ED;--hoyTxt:#11171C}}
:root[data-theme="dark"]{--bg:#11171C;--panel:#19222A;--panel2:#1F2A33;--ink:#E4E9ED;--ink2:#A7B3BC;--ink3:#6F7C86;--line:#2B363F;
--indec:#6FA3E6;--bcra:#4CC2AC;--estado:#E0826A;--privados:#B39AE0;--sectorial:#D6B460;--ok:#5CCB8D;--warn:#E8B04E;--bad:#F07A6B;--hoy:#E4E9ED;--hoyTxt:#11171C}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--indec);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 80px}
/* barra superior fija */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1*clamp(12px,3vw,32px)) 18px;padding:10px clamp(12px,3vw,32px)}
.bar .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{font-weight:700;font-size:15px;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.marca small{font-weight:500;color:var(--ink3);font-size:13px}
.reloj{font-weight:600;color:var(--ink2);font-size:14px}
.views{display:flex;gap:2px;background:var(--line);padding:2px;border-radius:8px}
.views button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px}
.views button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:650}
.buscar{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;width:220px}
.icono{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
/* hoy */
.hoy{background:var(--hoy);color:var(--hoyTxt);border-radius:16px;padding:22px clamp(16px,3vw,32px);display:grid;grid-template-columns:auto 1fr auto;gap:clamp(16px,4vw,44px);align-items:start;margin-bottom:18px}
.hoy .fecha{font-stretch:62%;font-weight:750;line-height:.82;font-size:clamp(64px,10vw,124px);letter-spacing:-.02em}
.hoy .fecha small{display:block;font-size:15px;font-stretch:100%;font-weight:500;margin-top:10px;opacity:.7;line-height:1.3}
.hoy h2{margin:4px 0 12px;font-size:16px;font-weight:600;opacity:.7}
.hoy ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.hoy li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;cursor:pointer}
.hoy li .h{font-weight:600;opacity:.7}.hoy li .t{font-size:clamp(17px,2vw,21px);font-weight:600;line-height:1.25}
.hoy li .t.baja{font-weight:400;opacity:.8;font-size:16px}.hoy li .o{font-size:13px;opacity:.6;font-weight:500;margin-left:6px}
.hoy .vacio{font-size:19px;font-weight:500;opacity:.85;margin:0}
.prox{min-width:210px;border-left:1px solid color-mix(in srgb,var(--hoyTxt) 25%,transparent);padding-left:clamp(14px,2vw,28px)}
.prox .l{font-size:13px;opacity:.65}.prox .cd{font-stretch:75%;font-weight:700;font-size:36px;line-height:1.05;margin:4px 0}
.prox .n{font-size:15px;font-weight:600;line-height:1.3}.prox .w{font-size:13px;opacity:.65;margin-top:2px}
/* resumen de estado */
.salud{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--ink2);margin:-4px 2px 16px}
.salud b{color:var(--ink)}
/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:14px}
.grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grupo>span{font-size:13px;color:var(--ink3);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px 4px 9px;cursor:pointer;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;color:var(--ink2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink3))}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink3)}
.alerta{border-left:3px solid var(--bad);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:14px}
.alerta b{color:var(--bad)}.alerta.info{border-color:var(--warn)}.alerta.info b{color:var(--warn)}
.nav{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;cursor:pointer}
.nav .rango{font-weight:650;font-size:17px;margin-left:6px}
/* estado de cada evento */
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 7px;line-height:1.5}
.st.confirmado{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.demorado{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.st.sin_verificar{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
/* agenda */
.agenda{display:grid;gap:14px}
.agdia{display:grid;grid-template-columns:120px 1fr;gap:18px;background:var(--panel);border-radius:12px;padding:14px 16px;border:1px solid transparent}
.agdia.es-hoy{border-color:var(--ink)}.agdia.pasado{opacity:.72}
.agdia .d .n{font-stretch:62%;font-weight:750;font-size:40px;line-height:.9}.agdia .d .w{font-size:13px;color:var(--ink2);margin-top:4px}
.agdia .d .fer{font-size:12px;color:var(--bad);display:block}
.ev{display:grid;grid-template-columns:4px 54px 1fr auto;gap:10px;padding:7px 6px 7px 0;cursor:pointer;border-radius:6px;align-items:start}
.ev:hover{background:var(--bg)}.ev .bar{border-radius:2px;background:var(--c);align-self:stretch}
.ev.est .bar{background:repeating-linear-gradient(var(--c) 0 4px,transparent 4px 7px)}
.ev .h{font-size:13px;color:var(--ink3);padding-top:1px}.ev .t{font-size:14.5px;line-height:1.3}
.ev.alta .t{font-weight:680;font-size:15.5px}.ev.baja .t{color:var(--ink2);font-size:13.5px}
.ev .m{font-size:12px;color:var(--ink3);margin-top:1px}
/* semana */
.semana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dia{background:var(--panel);border-radius:10px;padding:12px 10px 14px;min-height:220px;border:1px solid transparent}
.dia.es-hoy{border-color:var(--ink)}.dia.feriado,.celda.feriado{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--bg) 8px 9px)}
.dia header{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dia header .n{font-stretch:62%;font-weight:750;font-size:36px;line-height:.9}.dia header .d{font-size:13px;color:var(--ink2);line-height:1.2}
.dia header .fer{font-size:12px;color:var(--bad);display:block}
.dia .ev{grid-template-columns:4px 1fr}.dia .ev .h,.dia .ev .s{display:none}
/* mes */
.mes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.mes .cab{font-size:13px;color:var(--ink3);padding:0 4px}
.celda{background:var(--panel);border-radius:8px;padding:8px;min-height:104px;cursor:pointer;border:1px solid transparent;text-align:left;display:flex;flex-direction:column;gap:4px}
.celda.fuera{opacity:.35}.celda.es-hoy{border-color:var(--ink)}
.celda .n{font-stretch:62%;font-weight:750;font-size:24px;line-height:1}.celda .dens{display:flex;gap:2px;flex-wrap:wrap}
.celda .dens i{width:7px;height:7px;border-radius:2px;background:var(--c)}.celda .dens i.a{height:14px}
.celda .top{font-size:12px;line-height:1.25;color:var(--ink2)}.celda .top b{color:var(--ink);font-weight:650}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:22px;align-items:center}
.leyenda span{display:inline-flex;align-items:center;gap:6px}.leyenda .s{width:4px;height:14px;background:var(--ink3);border-radius:2px}
.leyenda .s.e{background:repeating-linear-gradient(var(--ink3) 0 4px,transparent 4px 7px)}
.link{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
/* panel lateral de detalle */
.cortina{position:fixed;inset:0;background:rgba(10,15,20,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.cortina.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel2);z-index:41;transform:translateX(100%);transition:transform .2s ease;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);border-left:6px solid var(--c,var(--ink3))}
.panel.on{transform:none}
.panel .org{font-size:13px;color:var(--ink2);font-weight:600}.panel h3{margin:4px 0 12px;font-size:21px;line-height:1.25}
.panel dl{display:grid;grid-template-columns:112px 1fr;gap:7px 12px;margin:0 0 18px;font-size:14px}.panel dt{color:var(--ink3)}.panel dd{margin:0}
.panel h4{font-size:14px;margin:18px 0 8px;color:var(--ink2);font-weight:600}
.hist{width:100%;border-collapse:collapse;font-size:13.5px}.hist td{padding:5px 6px;border-bottom:1px solid var(--line)}
.panel a{color:var(--indec)}.cerrar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;cursor:pointer}
.atajos{font-size:12.5px;color:var(--ink3)}kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}
@media (max-width:900px){.semana{grid-template-columns:1fr}.dia{min-height:0}.mes{gap:3px}.celda{min-height:62px;padding:5px}.celda .top{display:none}
.hoy{grid-template-columns:1fr}.prox{border-left:0;padding-left:0;border-top:1px solid color-mix(in srgb,var(--hoyTxt) 25%,transparent);padding-top:14px}
.agdia{grid-template-columns:1fr;gap:6px}.agdia .d{display:flex;align-items:baseline;gap:10px}.buscar{width:100%}.ev{grid-template-columns:4px 44px 1fr}.ev .s{grid-column:3}}
@media (prefers-reduced-motion:reduce){.panel,.cortina{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="in">
    <div class="marca">Calendario macro Argentina <small id="act"></small></div>
    <span class="reloj" id="reloj"></span>
    <input class="buscar" id="q" type="search" placeholder="Buscar (tecla /)" aria-label="Buscar publicación">
    <div class="views" role="group" aria-label="Vista">
      <button data-v="agenda" aria-pressed="true">Agenda</button><button data-v="semana" aria-pressed="false">Semana</button><button data-v="mes" aria-pressed="false">Mes</button>
    </div>
  </div></div>

  <section class="hoy" id="hoy" aria-live="polite"></section>
  <div class="salud" id="salud"></div>

  <div class="filtros">
    <div class="grupo" id="fOrg"><span>Fuente</span></div>
    <div class="grupo" id="fPri"><span>Prioridad</span></div>
    <div class="grupo" id="fOtros"></div>
  </div>
  <div id="alertas"></div>
  <nav class="nav" id="nav"></nav>
  <main id="vista"></main>

  <div class="leyenda">
    <span><i class="s"></i>Fecha oficial</span><span><i class="s e"></i>Fecha estimada</span>
    <span><span class="st confirmado">✓ salió</span></span><span><span class="st demorado">demorado</span></span><span><span class="st sin_verificar">sin verificar</span></span>
    <button class="link" id="ics">Exportar a mi calendario (.ics)</button>
    <button class="link" id="tema">Cambiar tema</button>
    <span class="atajos"><kbd>/</kbd> buscar <kbd>T</kbd> hoy <kbd>←</kbd><kbd>→</kbd> mover <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> vistas</span>
  </div>
</div>
<div class="cortina" id="cortina"></div>
<aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-label="Detalle de la publicación"></aside>

  if(!/^https?:/.test(location.protocol))return;

  try{ESTADO=await j("data/estado.json");fuenteDatos="vivo"}catch(e){}
  try{const c=await j("data/catalogo.json");const C={};c.forEach(x=>C[x.id]={n:x.nombre,o:x.organismo,b:x.bloque,f:x.frecuencia,p:x.prioridad,r:x.regla,cf:x.confianza,u:x.url,m:x.confirmacion});CAT=C;
      const ev=await j("data/eventos.json");preparar(ev);fuenteDatos="vivo"}catch(e){}
  try{const f=await j("data/feriados.json");const F={};f.forEach(x=>F[x.fecha]=x.nombre+(x.tipo==="a_verificar"?" (a confirmar)":""));FER=F}catch(e){}
}

const st=Object.assign({vista:"agenda",org:Object.keys(GR),pri:["alta","media"],est:true,sem:false,q:""},store.get("filtros2",{}));
let cursor=new Date(HOY);
function pasa(e){if(!st.org.includes(e.g)||!st.pri.includes(e.p))return false;if(!st.est&&e.o!=="oficial")return false;if(!st.sem&&e.sem)return false;
  if(st.q){const q=st.q.toLowerCase(),c=CAT[e.id]||{};return(e.t+" "+(c.n||"")+" "+(c.o||"")).toLowerCase().includes(q)}return true}
const orden=(a,b)=>PRI.indexOf(a.p)-PRI.indexOf(b.p)||(a.h||"99").localeCompare(b.h||"99");
const porDia=f=>E.filter(e=>e.f===f&&pasa(e)).sort(orden);
const nombre=e=>(CAT[e.id]||{}).n||e.t;
function stHTML(e){const s=estadoDe(e);if(!s)return"";const lab={confirmado:"✓ salió",demorado:"demorado",sin_verificar:"sin verificar"}[s.estado];if(!lab)return"";
  const d=s.estado==="confirmado"&&s.desvio_dias?` (${s.desvio_dias>0?"+":""}${s.desvio_dias}d)`:"";return`<span class="st ${s.estado}">${lab}${d}</span>`}
function evHTML(e){const meta=[(CAT[e.id]||{}).o,e.o!=="oficial"?"fecha estimada":null,e.al?"posible conflicto con feriado":null].filter(Boolean).join(" · ");
  return`<div class="ev ${e.p} ${e.o!=="oficial"?"est":""}" style="--c:${GR[e.g].c}" data-i="${e.i}" tabindex="0" role="button"><span class="bar"></span><span class="h">${e.h||""}</span><div><div class="t">${esc(nombre(e))}</div><div class="m">${esc(meta)}</div></div><span class="s">${stHTML(e)}</span></div>`}
function bind(root){root.querySelectorAll("[data-i]").forEach(el=>{el.onclick=()=>detalle(E[+el.dataset.i]);el.onkeydown=k=>{if(k.key==="Enter")detalle(E[+el.dataset.i])}})}

function chips(){
  const mk=(host,items)=>{host.querySelectorAll("button").forEach(b=>b.remove());items.forEach(([lab,on,fn,c])=>{const b=document.createElement("button");b.className="chip";if(c){b.style.setProperty("--c",c);b.innerHTML=`<i></i>${lab}`}else b.textContent=lab;b.setAttribute("aria-pressed",on);b.onclick=fn;host.append(b)})};
  mk($("#fOrg"),Object.entries(GR).map(([k,v])=>[v.n,st.org.includes(k),()=>{st.org=st.org.includes(k)?st.org.filter(x=>x!==k):[...st.org,k];guardar()},v.c]));
  mk($("#fPri"),PRI.map(p=>[p[0].toUpperCase()+p.slice(1),st.pri.includes(p),()=>{st.pri=st.pri.includes(p)?st.pri.filter(x=>x!==p):[...st.pri,p];guardar()}]));
  mk($("#fOtros"),[["Fechas estimadas",st.est,()=>{st.est=!st.est;guardar()}],["Semanales",st.sem,()=>{st.sem=!st.sem;guardar()}]]);
}
function guardar(){store.set("filtros2",{vista:st.vista,org:st.org,pri:st.pri,est:st.est,sem:st.sem});render()}

function proximo(){const a=ahoraAR();const ahora=a.f+"T"+String(a.h).padStart(2,"0")+":"+String(a.m).padStart(2,"0");
  return E.filter(e=>pasa(e)&&e.p==="alta"&&(e.f+"T"+(e.h||"23:59"))>ahora).sort((x,y)=>(x.f+(x.h||"")).localeCompare(y.f+(y.h||"")))[0]}
function cuenta(e){const [H,M]=(e.h||"00:00").split(":").map(Number);const a=ahoraAR();const hoy=parse(a.f);const dias=Math.round((parse(e.f)-hoy)/864e5);
  let min=dias*1440+(H*60+M)-(a.h*60+a.m);if(!e.h)return dias===0?"hoy":dias===1?"mañana":`en ${dias} días`;
  if(min<60)return`en ${min} min`;if(min<1440)return`en ${Math.floor(min/60)} h ${min%60} min`;return dias===1?`mañana ${e.h}`:`en ${dias} días`}
function hoyBox(){
  const f=iso(HOY),evs=porDia(f);
  let h=`<div class="fecha">${HOY.getDate()}<small>${DIAS[HOY.getDay()]}<br>${MESES[HOY.getMonth()]} ${HOY.getFullYear()}</small></div><div>`;
  h+=evs.length?`<h2>Hoy se publica</h2><ul>`+evs.map(e=>`<li data-i="${e.i}"><span class="h">${e.h||"—"}</span><span class="t ${e.p==="baja"?"baja":""}">${esc(nombre(e))}<span class="o">${esc((CAT[e.id]||{}).o||"")}</span> ${stHTML(e)}</span></li>`).join("")+`</ul>`
    :`<h2>Hoy</h2><p class="vacio">${FER[f]?"Feriado: "+esc(FER[f])+".":"No hay publicaciones con estos filtros."}</p>`;
  h+="</div>";const p=proximo();
  if(p){const d=parse(p.f);h+=`<div class="prox" data-i="${p.i}" style="cursor:pointer"><div class="l">Próximo dato clave</div><div class="cd">${cuenta(p)}</div><div class="n">${esc(nombre(p))}</div><div class="w">${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}${p.h?", "+p.h:""}</div></div>`}
  $("#hoy").innerHTML=h;bind($("#hoy"));
}
function salud(){
  const desde=iso(addD(HOY,-30)),hasta=iso(addD(HOY,-1));const pas=E.filter(e=>e.f>=desde&&e.f<=hasta);
  const c={confirmado:0,demorado:0,sin_verificar:0};pas.forEach(e=>{const s=estadoDe(e);if(s&&c[s.estado]!==undefined)c[s.estado]++});
  const ult=ESTADO.ultima_corrida?new Date(ESTADO.ultima_corrida).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):null;
  $("#act").textContent=fuenteDatos==="vivo"?(ult?`actualizado ${ult}`:"datos en vivo"):"";
  $("#salud").innerHTML=ult?`<span>Últimos 30 días: <b>${c.confirmado}</b> confirmados</span><span><b>${c.demorado}</b> demorados</span><span><b>${c.sin_verificar}</b> sin verificar</span>`:"";
}
function alertas(){
  const f0=iso(HOY);let h="";const by={};E.filter(e=>e.al&&e.f>=f0).forEach(e=>(by[e.f]=by[e.f]||[]).push(e));
  h+=Object.entries(by).map(([f,es])=>{const d=parse(f);return`<div class="alerta"><b>Posible cambio de fecha:</b> el ${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} es ${esc(FER[f]||"fin de semana")} y hay publicaciones programadas (${es.map(e=>esc(nombre(e))).join(", ")}). Si se confirma el feriado, se van a mover.</div>`}).join("");
  const dem=E.filter(e=>{const s=estadoDe(e);return s&&s.estado==="demorado"&&e.p==="alta"&&e.f>=iso(addD(HOY,-10))});
  if(dem.length)h+=`<div class="alerta"><b>Demorado:</b> ${dem.map(e=>esc(nombre(e))+" ("+parse(e.f).getDate()+"/"+(parse(e.f).getMonth()+1)+")").join(", ")} no aparece publicado todavía.</div>`;
  h+=`<div class="alerta info"><b>Sin fecha oficial:</b> Informe de Política Monetaria del III trimestre de 2026.</div>`;
  $("#alertas").innerHTML=h;
}
function navHTML(txt,prev,next){$("#nav").innerHTML=`<button id="ant" aria-label="Anterior">‹</button><button id="hoyB">Hoy</button><button id="sig" aria-label="Siguiente">›</button><span class="rango">${txt}</span>`;
  $("#ant").onclick=prev;$("#sig").onclick=next;$("#hoyB").onclick=()=>{cursor=new Date(HOY);render()}}

function vAgenda(){
  const ini=addD(cursor,-3),fin=addD(cursor,27);
  navHTML(`${ini.getDate()} de ${MESES[ini.getMonth()]} al ${fin.getDate()} de ${MESES[fin.getMonth()]}`,()=>{cursor=addD(cursor,-14);render()},()=>{cursor=addD(cursor,14);render()});
  let h='<div class="agenda">',n=0;
  for(let d=new Date(ini);d<=fin;d=addD(d,1)){const f=iso(d),evs=porDia(f);if(!evs.length&&!FER[f])continue;n+=evs.length;
    h+=`<section class="agdia ${f===iso(HOY)?"es-hoy":""} ${f<iso(HOY)?"pasado":""}" id="d${f}"><div class="d"><div class="n">${d.getDate()}</div><div class="w">${DIAS[d.getDay()]} ${d.getMonth()!==HOY.getMonth()?"de "+MESES[d.getMonth()]:""}${FER[f]?`<span class="fer">${esc(FER[f])}</span>`:""}</div></div><div>${evs.map(evHTML).join("")||'<div class="ev" style="cursor:default"><span></span><span></span><div class="m">Sin publicaciones</div></div>'}</div></section>`}
  $("#vista").innerHTML=n||h.length>30?h+"</div>":`<p>No hay publicaciones con estos filtros. Probá activar prioridad baja o las semanales.</p>`;bind($("#vista"));
}
function vSemana(){
  const L=lunes(cursor),V=addD(L,4);navHTML(`Semana del ${L.getDate()} ${L.getMonth()!==V.getMonth()?"de "+MESES[L.getMonth()]+" ":""}al ${V.getDate()} de ${MESES[V.getMonth()]}`,()=>{cursor=addD(cursor,-7);render()},()=>{cursor=addD(cursor,7);render()});
  let h='<div class="semana">';for(let k=0;k<5;k++){const d=addD(L,k),f=iso(d);
    h+=`<section class="dia ${f===iso(HOY)?"es-hoy":""} ${FER[f]?"feriado":""}"><header><span class="n">${d.getDate()}</span><span class="d">${DIAS[d.getDay()]}${FER[f]?`<span class="fer">${esc(FER[f])}</span>`:""}</span></header>${porDia(f).map(evHTML).join("")||'<p style="color:var(--ink3);font-size:13px;margin:4px 0">Sin publicaciones.</p>'}</section>`}
  $("#vista").innerHTML=h+"</div>";bind($("#vista"));
}
function vMes(){
  const y=cursor.getFullYear(),m=cursor.getMonth();navHTML(`${MESES[m]} ${y}`,()=>{cursor=new Date(y,m-1,1);render()},()=>{cursor=new Date(y,m+1,1);render()});
  let h='<div class="mes">'+["lunes","martes","miércoles","jueves","viernes"].map(d=>`<div class="cab">${d}</div>`).join("");
  const fin=new Date(y,m+1,0);for(let d=lunes(new Date(y,m,1));d<=fin||d.getDay()!==1;d=addD(d,1)){if(d>fin&&d.getDay()===1)break;if(d.getDay()<1||d.getDay()>5)continue;
    const f=iso(d),evs=porDia(f),alt=evs.filter(e=>e.p==="alta");
    h+=`<button class="celda ${d.getMonth()!==m?"fuera":""} ${f===iso(HOY)?"es-hoy":""} ${FER[f]?"feriado":""}" data-f="${f}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}: ${evs.length} publicaciones"><span class="n">${d.getDate()}</span><span class="dens">${evs.map(e=>`<i class="${e.p==="alta"?"a":""}" style="--c:${GR[e.g].c}"></i>`).join("")}</span><span class="top">${alt.slice(0,2).map(e=>`<b>${esc(nombre(e))}</b>`).join("<br>")}${FER[f]?`<br>${esc(FER[f])}`:""}</span></button>`}
  $("#vista").innerHTML=h+"</div>";$("#vista").querySelectorAll(".celda").forEach(c=>c.onclick=()=>{cursor=parse(c.dataset.f);st.vista="semana";marcar();render()});
}

function detalle(e){
  const c=CAT[e.id]||{},d=parse(e.f),s=estadoDe(e);const p=$("#panel");p.style.setProperty("--c",GR[e.g].c);
  const hist=E.filter(x=>x.id===e.id&&x.f<=iso(HOY)).slice(-12).reverse();
  const origen=e.o==="oficial"?"Calendario oficial del organismo":e.o==="derivada"?"Derivada de otra publicación":"Estimada por regla";
  p.innerHTML=`<button class="cerrar" id="cerrar">Cerrar</button><div class="org">${esc(c.o||"")}</div><h3>${esc(e.t)}</h3><dl>
  <dt>Fecha</dt><dd>${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}${e.h?", "+e.h:""}</dd>
  <dt>Origen</dt><dd>${origen}</dd>${s?`<dt>Estado</dt><dd>${stHTML(e)}${s.evidencia?` <a href="${esc(s.evidencia)}" target="_blank" rel="noopener">ver evidencia</a>`:""}</dd>`:""}
  ${e.per&&!String(e.per).startsWith("exp")?`<dt>Período</dt><dd>${esc(e.per)}</dd>`:""}<dt>Frecuencia</dt><dd>${esc(c.f||"—")}</dd><dt>Prioridad</dt><dd>${esc(c.p||"—")}</dd>
  <dt>Regla de fecha</dt><dd>${esc(c.r||"—")}</dd><dt>Confirmación</dt><dd>${esc(c.m||"—")}</dd>${e.al?`<dt>Alerta</dt><dd style="color:var(--bad)">${esc(FER[e.f]||"")}: la fecha puede moverse</dd>`:""}</dl>
  ${c.u?`<a href="${esc(c.u)}" target="_blank" rel="noopener">Abrir en el sitio del organismo</a>`:""}
  ${hist.length?`<h4>Publicaciones anteriores</h4><table class="hist">${hist.map(x=>{const q=parse(x.f);return`<tr><td>${q.getDate()}/${q.getMonth()+1}/${String(q.getFullYear()).slice(2)}</td><td>${esc(x.per&&!String(x.per).startsWith("exp")?x.per:"")}</td><td>${stHTML(x)}</td></tr>`}).join("")}</table>`:""}`;
  p.classList.add("on");p.setAttribute("aria-hidden","false");$("#cortina").classList.add("on");$("#cerrar").onclick=cerrar;$("#cerrar").focus();
}
function cerrar(){$("#panel").classList.remove("on");$("#panel").setAttribute("aria-hidden","true");$("#cortina").classList.remove("on")}
$("#cortina").onclick=cerrar;

function exportarICS(){
  const hasta=iso(addD(HOY,120)),evs=E.filter(e=>pasa(e)&&e.f>=iso(HOY)&&e.f<=hasta);
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//calendario-macro//AR","X-WR-CALNAME:Calendario macro Argentina","X-WR-TIMEZONE:America/Argentina/Buenos_Aires"];
  evs.forEach(e=>{const f=e.f.replace(/-/g,"");const uid=clave(e).replace(/[^a-z0-9]/gi,"")+"@calmacro";
    L.push("BEGIN:VEVENT","UID:"+uid,"SUMMARY:"+((CAT[e.id]||{}).o||"")+": "+nombre(e).replace(/[,;]/g," "),
      e.h?"DTSTART;TZID=America/Argentina/Buenos_Aires:"+f+"T"+e.h.replace(":","")+"00":"DTSTART;VALUE=DATE:"+f,
      "DESCRIPTION:"+(e.o==="oficial"?"Fecha oficial":"Fecha estimada")+" - prioridad "+e.p,"END:VEVENT")});
  L.push("END:VCALENDAR");
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar"}));a.download="calendario-macro.ics";a.click()}
  catch(x){alert("La exportación funciona en la versión publicada en GitHub.")}
}
$("#ics").onclick=exportarICS;

function marcar(){document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.vista))}
document.querySelectorAll(".views button").forEach(b=>b.onclick=()=>{st.vista=b.dataset.v;marcar();guardar()});
$("#q").oninput=ev=>{st.q=ev.target.value.trim();render()};
$("#tema").onclick=()=>{const r=document.documentElement;const osc=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=osc?"light":"dark";store.set("tema",r.dataset.theme)};
{const t=store.get("tema",null);if(t)document.documentElement.dataset.theme=t}
document.addEventListener("keydown",k=>{if(k.target.tagName==="INPUT"){if(k.key==="Escape")k.target.blur();return}
  if(k.key==="Escape")return cerrar();if(k.key==="/"){k.preventDefault();$("#q").focus()}
  if(k.key==="t"||k.key==="T"){cursor=new Date(HOY);render()}
  const paso={agenda:14,semana:7,mes:30}[st.vista];if(k.key==="ArrowRight"){cursor=st.vista==="mes"?new Date(cursor.getFullYear(),cursor.getMonth()+1,1):addD(cursor,paso);render()}
  if(k.key==="ArrowLeft"){cursor=st.vista==="mes"?new Date(cursor.getFullYear(),cursor.getMonth()-1,1):addD(cursor,-paso);render()}
  const v={"1":"agenda","2":"semana","3":"mes"}[k.key];if(v){st.vista=v;marcar();guardar()}});

function reloj(){const a=ahoraAR();$("#reloj").textContent=`${String(a.h).padStart(2,"0")}:${String(a.m).padStart(2,"0")} en Buenos Aires`;
  const nuevo=parse(a.f);if(iso(nuevo)!==iso(HOY)){HOY=nuevo;render()}else hoyBox()}
function render(){chips();hoyBox();salud();alertas();({agenda:vAgenda,semana:vSemana,mes:vMes})[st.vista]()}
preparar(EV0);marcar();render();reloj();setInterval(reloj,30000);
cargarVivo().then(()=>{render()});
</script></body></html>
